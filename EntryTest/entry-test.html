<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entry Exam Study Guide | 入门考试学习指南</title>
<style>
:root {
  --primary: #1a56db;
  --primary-light: #e8eefb;
  --bg: #f5f7fa;
  --bg-card: #ffffff;
  --text: #1f2937;
  --text-secondary: #6b7280;
  --border: #e5e7eb;
  --sidebar-bg: #1e293b;
  --sidebar-text: #e2e8f0;
  --sidebar-hover: #334155;
  --sidebar-active: #3b82f6;
  --success: #10b981;
  --warning: #f59e0b;
  --danger: #ef4444;
  --accent1: #3b82f6;
  --accent2: #8b5cf6;
  --accent3: #06b6d4;
  --accent4: #f97316;
  --accent5: #ec4899;
  --accent6: #14b8a6;
  --accent7: #6366f1;
  --accent8: #84cc16;
  --accent9: #f43f5e;
  --shadow: 0 1px 3px rgba(0,0,0,.1);
  --shadow-lg: 0 4px 12px rgba(0,0,0,.1);
  --radius: 8px;
  --sidebar-w: 260px;
}
.dark {
  --bg: #0f172a;
  --bg-card: #1e293b;
  --text: #e2e8f0;
  --text-secondary: #94a3b8;
  --border: #334155;
  --primary-light: #1e3a5f;
  --shadow: 0 1px 3px rgba(0,0,0,.3);
  --shadow-lg: 0 4px 12px rgba(0,0,0,.3);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  transition: background .3s, color .3s;
}
/* Sidebar */
.sidebar {
  position: fixed; top:0; left:0; width: var(--sidebar-w); height:100vh;
  background: var(--sidebar-bg); color: var(--sidebar-text);
  overflow-y: auto; z-index: 100; transition: transform .3s;
  display: flex; flex-direction: column;
}
.sidebar-header {
  padding: 20px 16px; border-bottom: 1px solid rgba(255,255,255,.1);
  display: flex; align-items: center; gap: 10px;
}
.sidebar-header h2 { font-size: 16px; font-weight: 600; }
.sidebar-logo { font-size: 24px; }
.sidebar nav { flex:1; padding: 8px 0; }
.sidebar nav a {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 16px; color: var(--sidebar-text); text-decoration: none;
  font-size: 14px; transition: background .2s; cursor: pointer;
  border-left: 3px solid transparent;
}
.sidebar nav a:hover { background: var(--sidebar-hover); }
.sidebar nav a.active { background: var(--sidebar-hover); border-left-color: var(--sidebar-active); color: #fff; }
.sidebar nav a .badge {
  margin-left: auto; font-size: 11px; padding: 2px 6px;
  border-radius: 10px; background: rgba(255,255,255,.15);
}
.sidebar-footer {
  padding: 12px 16px; border-top: 1px solid rgba(255,255,255,.1);
  display: flex; gap: 8px; flex-wrap: wrap;
}
.sidebar-footer button {
  padding: 6px 12px; border-radius: 6px; border: 1px solid rgba(255,255,255,.2);
  background: transparent; color: var(--sidebar-text); cursor: pointer;
  font-size: 12px; transition: background .2s;
}
.sidebar-footer button:hover { background: var(--sidebar-hover); }
.sidebar-footer button.active-toggle { background: var(--sidebar-active); border-color: var(--sidebar-active); color: #fff; }
/* Main */
.main {
  margin-left: var(--sidebar-w); padding: 24px 32px;
  max-width: 960px; min-height: 100vh;
}
/* Hamburger */
.hamburger {
  display: none; position: fixed; top: 12px; left: 12px; z-index: 200;
  background: var(--sidebar-bg); color: #fff; border: none;
  width: 40px; height: 40px; border-radius: 8px; font-size: 20px; cursor: pointer;
}
.overlay {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5);
  z-index: 99;
}
/* Search */
.search-bar {
  position: sticky; top: 0; z-index: 50; padding: 12px 0;
  background: var(--bg); margin-bottom: 16px;
}
.search-bar input {
  width: 100%; padding: 10px 16px 10px 40px; border-radius: var(--radius);
  border: 1px solid var(--border); background: var(--bg-card);
  font-size: 14px; color: var(--text); outline: none;
  transition: border-color .2s;
}
.search-bar input:focus { border-color: var(--primary); }
.search-bar::before {
  content: "🔍"; position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
  font-size: 16px;
}
.search-results {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow-lg);
  max-height: 400px; overflow-y: auto; display: none;
}
.search-results.show { display: block; }
.search-result-item {
  padding: 10px 16px; cursor: pointer; border-bottom: 1px solid var(--border);
  font-size: 13px;
}
.search-result-item:hover { background: var(--primary-light); }
.search-result-item mark { background: #fde68a; padding: 0 2px; border-radius: 2px; }
/* Cards */
.card {
  background: var(--bg-card); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 24px; margin-bottom: 20px;
  border: 1px solid var(--border);
}
.card h2 { font-size: 20px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.card h3 { font-size: 16px; margin: 16px 0 8px; color: var(--text); }
.card p, .card li { font-size: 14px; color: var(--text-secondary); margin-bottom: 6px; }
.card ul { padding-left: 20px; }
/* Chapter header */
.chapter-header {
  display: flex; align-items: center; gap: 12px;
  padding: 20px 24px; border-radius: var(--radius);
  margin-bottom: 16px; color: #fff; cursor: pointer;
}
.chapter-header h1 { font-size: 22px; }
.chapter-header .weight {
  margin-left: auto; font-size: 13px; background: rgba(255,255,255,.25);
  padding: 4px 10px; border-radius: 12px;
}
.chapter-header .time {
  font-size: 13px; background: rgba(255,255,255,.2);
  padding: 4px 10px; border-radius: 12px;
}
/* Section toggles */
.section-toggle {
  display: flex; align-items: center; gap: 8px; padding: 12px 0;
  cursor: pointer; font-size: 15px; font-weight: 600;
  border-bottom: 1px solid var(--border);
}
.section-toggle .arrow { transition: transform .2s; }
.section-toggle.open .arrow { transform: rotate(90deg); }
.section-content { display: none; padding: 12px 0; }
.section-content.show { display: block; }
/* Difficulty */
.diff { font-size: 12px; }
/* Key term */
.key-term {
  background: var(--primary-light); padding: 1px 4px; border-radius: 3px;
  font-weight: 600; cursor: help; position: relative;
}
/* Formula */
.formula {
  background: var(--primary-light); padding: 12px 16px;
  border-radius: var(--radius); font-family: monospace;
  font-size: 14px; margin: 8px 0; border-left: 3px solid var(--primary);
}
/* Bookmark */
.bookmark-btn {
  background: none; border: none; cursor: pointer; font-size: 18px;
  color: var(--text-secondary); transition: color .2s;
}
.bookmark-btn.active { color: var(--warning); }
/* Quiz */
.quiz-controls {
  display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px;
}
.quiz-controls button, .btn {
  padding: 8px 16px; border-radius: 6px; border: 1px solid var(--border);
  background: var(--bg-card); color: var(--text); cursor: pointer;
  font-size: 13px; transition: all .2s;
}
.quiz-controls button:hover, .btn:hover { background: var(--primary-light); }
.btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
.btn-primary:hover { opacity: .9; }
.btn-success { background: var(--success); color: #fff; border-color: var(--success); }
.btn-danger { background: var(--danger); color: #fff; border-color: var(--danger); }
.question-card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 20px; margin-bottom: 16px;
}
.question-card h4 { font-size: 14px; margin-bottom: 12px; line-height: 1.5; }
.option-btn {
  display: block; width: 100%; text-align: left; padding: 10px 14px;
  margin-bottom: 6px; border-radius: 6px; border: 1px solid var(--border);
  background: var(--bg-card); color: var(--text); cursor: pointer;
  font-size: 13px; transition: all .2s;
}
.option-btn:hover { border-color: var(--primary); background: var(--primary-light); }
.option-btn.correct { border-color: var(--success); background: #d1fae5; color: #065f46; }
.option-btn.wrong { border-color: var(--danger); background: #fee2e2; color: #991b1b; }
.option-btn.disabled { pointer-events: none; }
.dark .option-btn.correct { background: #064e3b; color: #6ee7b7; }
.dark .option-btn.wrong { background: #7f1d1d; color: #fca5a5; }
.explanation {
  margin-top: 10px; padding: 12px; background: var(--primary-light);
  border-radius: 6px; font-size: 13px; display: none;
}
.explanation.show { display: block; }
/* Progress bar */
.progress-bar {
  height: 6px; background: var(--border); border-radius: 3px; overflow: hidden;
  margin: 8px 0;
}
.progress-bar .fill {
  height: 100%; border-radius: 3px; transition: width .3s;
  background: linear-gradient(90deg, var(--primary), var(--accent2));
}
/* Study plan */
.day-card {
  display: flex; gap: 12px; padding: 12px; border-radius: var(--radius);
  border: 1px solid var(--border); margin-bottom: 8px; align-items: flex-start;
  transition: background .2s;
}
.day-card:hover { background: var(--primary-light); }
.day-card.completed { opacity: .7; }
.day-checkbox {
  width: 20px; height: 20px; accent-color: var(--primary); cursor: pointer;
  margin-top: 2px; flex-shrink: 0;
}
.day-info { flex: 1; }
.day-label { font-weight: 600; font-size: 14px; }
.day-detail { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }
.day-topics { font-size: 13px; margin-top: 4px; }
.milestone { background: linear-gradient(135deg, #fef3c7, #fde68a); border-color: var(--warning); }
.dark .milestone { background: linear-gradient(135deg, #451a03, #78350f); }
/* Checklist */
.checklist-item {
  display: flex; gap: 10px; padding: 8px 0;
  border-bottom: 1px solid var(--border); align-items: flex-start;
}
.checklist-item label { flex: 1; font-size: 13px; cursor: pointer; }
/* Tabs */
.tabs { display: flex; gap: 4px; margin-bottom: 16px; flex-wrap: wrap; }
.tab {
  padding: 8px 16px; border-radius: 6px 6px 0 0; cursor: pointer;
  font-size: 13px; border: 1px solid var(--border); border-bottom: none;
  background: var(--bg); color: var(--text-secondary);
}
.tab.active { background: var(--bg-card); color: var(--primary); font-weight: 600; }
/* Stats */
.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; margin-bottom: 16px; }
.stat-box {
  text-align: center; padding: 16px; border-radius: var(--radius);
  background: var(--bg); border: 1px solid var(--border);
}
.stat-box .num { font-size: 28px; font-weight: 700; color: var(--primary); }
.stat-box .label { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }
/* Timer */
.timer {
  font-size: 20px; font-weight: 700; color: var(--danger);
  text-align: center; padding: 8px; display: none;
}
.timer.active { display: block; }
/* Bookmarks panel */
.bookmarks-panel { max-height: 300px; overflow-y: auto; }
.bookmark-item {
  padding: 8px 12px; cursor: pointer; font-size: 13px;
  border-bottom: 1px solid var(--border); display: flex; justify-content: space-between;
}
.bookmark-item:hover { background: var(--primary-light); }
/* Section pages hide/show */
.page { display: none; }
.page.active { display: block; }
/* Responsive */
@media (max-width: 768px) {
  .sidebar { transform: translateX(-100%); }
  .sidebar.open { transform: translateX(0); }
  .hamburger { display: flex; align-items: center; justify-content: center; }
  .overlay.show { display: block; }
  .main { margin-left: 0; padding: 60px 16px 24px; }
  .chapter-header h1 { font-size: 18px; }
  .stat-grid { grid-template-columns: repeat(2, 1fr); }
}
@media (min-width: 769px) and (max-width: 1024px) {
  :root { --sidebar-w: 220px; }
  .main { padding: 24px 20px; }
}
/* Scrollbar */
.sidebar::-webkit-scrollbar { width: 4px; }
.sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); border-radius: 2px; }
/* Animations */
@keyframes fadeIn { from { opacity:0; transform: translateY(10px); } to { opacity:1; transform: translateY(0); } }
.card { animation: fadeIn .3s ease; }
.week-header { font-size: 18px; font-weight: 700; margin: 20px 0 12px; padding-bottom: 8px; border-bottom: 2px solid var(--primary); }
</style>
</head>
<body>
<button class="hamburger" onclick="toggleSidebar()">☰</button>
<div class="overlay" onclick="toggleSidebar()"></div>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <span class="sidebar-logo">📚</span>
    <h2 id="sidebarTitle">入门考试学习指南</h2>
  </div>
  <nav id="sidebarNav"></nav>
  <div id="bookmarksSection" style="padding:8px 16px;display:none;">
    <div style="font-size:12px;color:#94a3b8;margin-bottom:6px;" data-i18n="bookmarks">书签</div>
    <div class="bookmarks-panel" id="bookmarksPanel"></div>
  </div>
  <div class="sidebar-footer">
    <button onclick="toggleDark()" id="darkBtn">🌙</button>
    <button onclick="toggleLang()" id="langBtn">EN</button>
  </div>
</aside>

<main class="main" id="mainContent"></main>

<script>
// ===== DATA =====
const LANG = { zh: 'zh', en: 'en' };
let currentLang = localStorage.getItem('lang') || 'zh';
let isDark = localStorage.getItem('dark') === 'true';
let currentPage = localStorage.getItem('currentPage') || 'home';

const chapterColors = ['#3b82f6','#8b5cf6','#06b6d4','#f97316','#ec4899','#14b8a6','#6366f1','#84cc16','#f43f5e'];

const chapters = [
  {
    id:'ch1', icon:'📈',
    title:{zh:'宏观经济学',en:'Macroeconomics'}, weight:'18-20%', studyTime:'3-4h',
    sections:[
      {id:'s1_1',title:{zh:'1.1 经济周期与常见经济指标',en:'1.1 Business Cycle & Economic Indicators'},diff:2,
       content:{
         zh:'<p><b>经济周期</b>是指总体经济活动围绕经济长期潜在增长趋势发生的周期性、不规则波动，包含<b>扩张、顶峰、收缩（衰退）、谷底</b>四个阶段。</p><h3>四个阶段</h3><ul><li><b>扩张期 (Expansion)</b>：GDP稳步增长，就业扩大，消费者信心增强。</li><li><b>顶峰期 (Peak)</b>：经济增长放缓至停滞，通胀压力达到顶峰。</li><li><b>收缩期/衰退期 (Contraction/Recession)</b>：GDP下降，企业削减投资，裁员增加。连续≥2个季度负增长。</li><li><b>谷底期 (Trough)</b>：经济下滑停止，产出触底，信心开始重建。</li></ul><h3>关键驱动因素</h3><ul><li><b>消费支出</b>：占美国GDP 68-70%，主要驱动力。</li><li><b>商业投资</b>：受利率和利润影响。</li><li><b>货币政策</b>：美联储通过利率调节借贷成本。</li><li><b>净出口</b>：受汇率和全球需求影响。</li></ul><h3>常用经济指标</h3><ul><li><b>先行指标 (Leading)</b>：ISM制造业PMI、耐用品订单、消费者信心指数(CCI)、10年-2年国债利差</li><li><b>同步指标 (Coincident)</b>：GDP、非农就业(NFP)、零售销售</li><li><b>滞后指标 (Lagging)</b>：失业率、CPI、PCE物价指数</li></ul>',
         en:'<p><b>The business cycle</b> refers to recurring, irregular fluctuations in aggregate economic activity around the economy\'s long-term potential growth trend. It has <b>four phases: Expansion, Peak, Contraction (Recession), Trough</b>.</p><h3>Four Phases</h3><ul><li><b>Expansion</b>: Real GDP grows steadily; employment expands; consumer confidence strengthens.</li><li><b>Peak</b>: Growth slows to a halt; inflationary pressures peak.</li><li><b>Contraction/Recession</b>: Real GDP declines; businesses cut investment; layoffs increase. Negative growth for ≥2 quarters.</li><li><b>Trough</b>: Economic decline stops; output hits bottom; confidence begins to rebuild.</li></ul><h3>Key Drivers</h3><ul><li><b>Consumer Spending</b>: ~68-70% of U.S. GDP, primary driver.</li><li><b>Business Investment</b>: Sensitive to interest rates and profit margins.</li><li><b>Monetary Policy</b>: Fed adjusts rates to influence borrowing costs.</li><li><b>Net Exports</b>: Affected by USD exchange rate and global demand.</li></ul><h3>Common Economic Indicators</h3><ul><li><b>Leading</b>: ISM Manufacturing PMI, Durable Goods Orders, CCI, 10Y-2Y Spread</li><li><b>Coincident</b>: GDP, Nonfarm Payrolls (NFP), Retail Sales</li><li><b>Lagging</b>: Unemployment Rate, CPI, PCE Price Index</li></ul>'
       }},
      {id:'s1_2',title:{zh:'1.2 货币政策',en:'1.2 Monetary Policy'},diff:2,
       content:{
         zh:'<p><b>目标</b>：充分就业和物价稳定（2%通胀目标）。</p><h3>主要工具</h3><ul><li><b>公开市场操作 (OMO)</b>：买卖国债/MBS，调节准备金。</li><li><b>准备金余额利息 (IORB)</b>：利率下限，主要控制工具。</li><li><b>隔夜逆回购 (ONRRP)</b>：辅助下限，吸收过剩流动性。</li><li><b>贴现率 (Discount Rate)</b>：利率上限，紧急贷款窗口。</li></ul><p><b>加息</b>→借贷成本上升→消费投资减少→经济降温→抑制通胀<br><b>降息</b>→借贷成本下降→消费投资增加→经济刺激→促进就业</p>',
         en:'<p><b>Objectives</b>: Full employment and price stability (2% inflation target).</p><h3>Key Tools</h3><ul><li><b>Open Market Operations (OMO)</b>: Buy/sell Treasuries & MBS to adjust reserves.</li><li><b>Interest On Reserve Balances (IORB)</b>: Rate floor, primary control tool.</li><li><b>Overnight Reverse Repo (ONRRP)</b>: Auxiliary floor, absorbs excess liquidity.</li><li><b>Discount Rate</b>: Rate ceiling, emergency lending window.</li></ul><p><b>Rate hikes</b> → higher borrowing costs → less spending/investment → cools economy → curbs inflation<br><b>Rate cuts</b> → lower borrowing costs → more spending/investment → stimulates economy → promotes employment</p>'
       }},
      {id:'s1_3',title:{zh:'1.3 财政政策',en:'1.3 Fiscal Policy'},diff:1,
       content:{
         zh:'<p><b>工具</b>：税收和政府支出。</p><ul><li><b>扩张性 (Expansionary)</b>：减税/增支，用于衰退期刺激需求。</li><li><b>收缩性 (Contractionary)</b>：加税/减支，用于过热期控制通胀。</li></ul><p><b>逆周期调节</b>：政策方向与经济周期相反，以平滑波动。</p>',
         en:'<p><b>Tools</b>: Taxation and government spending.</p><ul><li><b>Expansionary</b>: Tax cuts / increased spending, used during recessions to boost demand.</li><li><b>Contractionary</b>: Tax hikes / reduced spending, used during overheating to control inflation.</li></ul><p><b>Countercyclical regulation</b>: Policy direction is opposite to the business cycle to smooth fluctuations.</p>'
       }},
      {id:'s1_4',title:{zh:'1.4 政策与资产表现',en:'1.4 Policy & Asset Performance'},diff:3,
       content:{
         zh:'<h3>资产表现</h3><ul><li><b>扩张期</b>：股票(成长型) > 商品 > 债券</li><li><b>衰退期</b>：债券(长债) > 股票(防御型)</li></ul><h3>利率影响</h3><ul><li><b>加息</b>：债券价格下跌（收益率上升），股市承压（估值回调）。</li><li><b>降息</b>：债券价格上涨，股市通常受益（软着陆时），但在衰退期可能下跌。</li></ul>',
         en:'<h3>Asset Performance</h3><ul><li><b>Expansion</b>: Stocks (growth) > Commodities > Bonds</li><li><b>Recession</b>: Bonds (long-term) > Stocks (defensive)</li></ul><h3>Interest Rate Impact</h3><ul><li><b>Rate hikes</b>: Bond prices fall (yields rise), stocks under pressure (valuation correction).</li><li><b>Rate cuts</b>: Bond prices rise, stocks typically benefit (in soft landings), but may fall during recessions.</li></ul>'
       }}
    ]
  },
  {
    id:'ch2', icon:'📊',
    title:{zh:'股票',en:'Stocks'}, weight:'~15%', studyTime:'2-3h',
    sections:[
      {id:'s2_1',title:{zh:'2.1 市场与股票类型',en:'2.1 Markets & Stock Types'},diff:1,
       content:{
         zh:'<ul><li><b>一级市场 (Primary)</b>：IPO，公司发行新股融资。</li><li><b>二级市场 (Secondary)</b>：投资者之间交易已发行股票。</li><li><b>普通股</b>：有投票权，股息不固定，清偿顺位低。</li><li><b>优先股</b>：通常无投票权，股息固定，清偿顺位优先于普通股。</li><li><b>ADR</b>：在美国交易的外国公司股票凭证（如BABA）。</li></ul>',
         en:'<ul><li><b>Primary Market</b>: IPOs, companies issue new shares to raise capital.</li><li><b>Secondary Market</b>: Investors trade existing shares among themselves.</li><li><b>Common Stock</b>: Voting rights, variable dividends, lower liquidation priority.</li><li><b>Preferred Stock</b>: Usually no voting rights, fixed dividends, higher liquidation priority.</li><li><b>ADR</b>: Foreign company stock certificates traded on U.S. exchanges (e.g., BABA).</li></ul>'
       }},
      {id:'s2_2',title:{zh:'2.2 公司行为',en:'2.2 Corporate Actions'},diff:2,
       content:{
         zh:'<ul><li><b>股息 (Dividends)</b>：利润分配。除息日(Ex-Dividend Date)前买入才享有股息。</li><li><b>股票分割 (Stock Splits)</b>：增加股数，降低股价，总价值不变。如苹果2020年4拆1。</li><li><b>股票回购 (Buybacks)</b>：公司买回自家股票，减少流通股，提升EPS。</li><li><b>并购 (M&A)</b>：合并或收购。</li></ul>',
         en:'<ul><li><b>Dividends</b>: Profit distribution. Must own before ex-dividend date to receive.</li><li><b>Stock Splits</b>: Increase shares, reduce price, total value unchanged. E.g., Apple 2020 4-for-1.</li><li><b>Buybacks</b>: Company repurchases own shares, reduces outstanding shares, boosts EPS.</li><li><b>M&A</b>: Mergers and acquisitions.</li></ul>'
       }},
      {id:'s2_3',title:{zh:'2.3 核心估值指标',en:'2.3 Key Valuation Metrics'},diff:2,
       content:{
         zh:'<div class="formula">市值 (Market Cap) = 股价 × 流通股数</div><div class="formula">EPS = (净利润 - 优先股股息) / 平均流通股数</div><div class="formula">股息率 = 每股股息 / 股价</div><div class="formula">P/E = 股价 / EPS （高P/E→高增长预期）</div><div class="formula">P/B = 股价 / 每股净资产 （适用于重资产行业）</div><div class="formula">ROE = 净利润 / 股东权益 （衡量盈利效率）</div>',
         en:'<div class="formula">Market Cap = Share Price × Shares Outstanding</div><div class="formula">EPS = (Net Income - Preferred Dividends) / Avg Shares Outstanding</div><div class="formula">Dividend Yield = Dividend per Share / Share Price</div><div class="formula">P/E = Share Price / EPS (High P/E → high growth expectations)</div><div class="formula">P/B = Share Price / Book Value per Share (useful for asset-heavy industries)</div><div class="formula">ROE = Net Income / Shareholders\' Equity (measures profitability efficiency)</div>'
       }}
    ]

  {
    id:'ch3', icon:'📦',
    title:{zh:'ETF',en:'ETF'}, weight:'~10%', studyTime:'2h',
    sections:[
      {id:'s3_1',title:{zh:'3.1 ETF特征与原理',en:'3.1 ETF Features & Mechanics'},diff:1,
       content:{
         zh:'<p><b>ETF</b>是追踪指数、像股票一样在交易所交易的基金。</p><ul><li><b>机制</b>：申购/赎回机制(Creation/Redemption)保持价格紧贴NAV。</li><li><b>优势</b>：分散风险、低费率、高流动性、税务优势（实物赎回减少资本收益分配）。</li><li><b>风险</b>：市场风险、追踪误差。</li></ul>',
         en:'<p><b>ETF</b> is a fund that tracks an index and trades on exchanges like individual stocks.</p><ul><li><b>Mechanism</b>: Creation/Redemption mechanism keeps price close to NAV.</li><li><b>Advantages</b>: Diversification, low fees, high liquidity, tax efficiency (in-kind redemptions reduce capital gains).</li><li><b>Risks</b>: Market risk, tracking error.</li></ul>'
       }},
      {id:'s3_2',title:{zh:'3.2 常见ETF类型',en:'3.2 Common ETF Types'},diff:1,
       content:{
         zh:'<ul><li><b>股票型</b>：SPY, QQQ</li><li><b>债券型</b>：TLT, AGG</li><li><b>商品型</b>：GLD</li><li><b>加密货币型</b>：IBIT</li><li><b>主题型</b>：ARKK</li></ul>',
         en:'<ul><li><b>Equity</b>: SPY, QQQ</li><li><b>Bond</b>: TLT, AGG</li><li><b>Commodity</b>: GLD</li><li><b>Crypto</b>: IBIT</li><li><b>Thematic</b>: ARKK</li></ul>'
       }},
      {id:'s3_3',title:{zh:'3.3 杠杆与反向ETF',en:'3.3 Leveraged & Inverse ETFs'},diff:3,
       content:{
         zh:'<p><b>原理</b>：使用衍生品放大单日回报（如2x, 3x）。</p><p><b>核心风险 — 波动率损耗 (Volatility Decay)</b>：长期持有会因每日重置机制导致价值侵蚀。仅适合短期交易。</p><p>在<b>高度波动（起伏）的市场</b>中损耗最严重。</p>',
         en:'<p><b>Mechanism</b>: Uses derivatives to amplify daily returns (e.g., 2x, 3x).</p><p><b>Core Risk — Volatility Decay</b>: Long-term holding erodes value due to daily reset mechanism. Only suitable for short-term trading.</p><p>Decay is most severe in <b>highly volatile (up-and-down) markets</b>.</p>'
       }}
    ]
  },
  {
    id:'ch4', icon:'⚡',
    title:{zh:'期权',en:'Options'}, weight:'~10%', studyTime:'3-4h',
    sections:[
      {id:'s4_1',title:{zh:'4.1 期权合约基础',en:'4.1 Option Contract Basics'},diff:1,
       content:{
         zh:'<ul><li><b>Call (看涨)</b>：买方有权以行权价<b>买入</b>，看涨后市。</li><li><b>Put (看跌)</b>：买方有权以行权价<b>卖出</b>，看跌后市。</li><li><b>美式</b>：可随时行权（美股期权主流）。</li><li><b>欧式</b>：仅到期日行权（指数期权主流）。</li></ul>',
         en:'<ul><li><b>Call</b>: Buyer has the right to <b>buy</b> at strike price. Bullish.</li><li><b>Put</b>: Buyer has the right to <b>sell</b> at strike price. Bearish.</li><li><b>American</b>: Can be exercised anytime (dominant for U.S. stock options).</li><li><b>European</b>: Can only be exercised at expiration (dominant for index options).</li></ul>'
       }},
      {id:'s4_2',title:{zh:'4.2 盈亏计算',en:'4.2 Profit/Loss Calculations'},diff:2,
       content:{
         zh:'<div class="formula">Long Call 盈亏平衡点 = Strike + Premium | 最大损失 = Premium</div><div class="formula">Long Put 盈亏平衡点 = Strike - Premium | 最大损失 = Premium</div><div class="formula">Short Call/Put 最大收益 = Premium | Short Call 风险无限</div>',
         en:'<div class="formula">Long Call Breakeven = Strike + Premium | Max Loss = Premium</div><div class="formula">Long Put Breakeven = Strike - Premium | Max Loss = Premium</div><div class="formula">Short Call/Put Max Gain = Premium | Short Call has unlimited risk</div>'
       }},
      {id:'s4_3',title:{zh:'4.3 价值状态与影响因素',en:'4.3 Moneyness & Pricing Factors'},diff:2,
       content:{
         zh:'<h3>价值状态 (Moneyness)</h3><ul><li><b>ITM (价内)</b>：Call（市价>行权价），Put（市价<行权价）。有内在价值。</li><li><b>ATM (平价)</b>：市价≈行权价。</li><li><b>OTM (价外)</b>：无内在价值，仅有时间价值。</li></ul><h3>影响因素</h3><ul><li><b>标的价格↑</b>：Call↑, Put↓</li><li><b>行权价↑</b>：Call↓, Put↑</li><li><b>时间↑</b>：Call/Put通常↑（时间价值）</li><li><b>波动率↑</b>：Call/Put均↑</li></ul>',
         en:'<h3>Moneyness</h3><ul><li><b>ITM (In-the-Money)</b>: Call (S>X), Put (S<X). Has intrinsic value.</li><li><b>ATM (At-the-Money)</b>: S ≈ X.</li><li><b>OTM (Out-of-the-Money)</b>: No intrinsic value, only time value.</li></ul><h3>Pricing Factors</h3><ul><li><b>Stock price ↑</b>: Call↑, Put↓</li><li><b>Strike price ↑</b>: Call↓, Put↑</li><li><b>Time ↑</b>: Call/Put usually ↑ (time value)</li><li><b>Volatility ↑</b>: Both Call/Put ↑</li></ul>'
       }}
    ]
  },
  {
    id:'ch5', icon:'💰',
    title:{zh:'基金',en:'Funds'}, weight:'~10%', studyTime:'1.5-2h',
    sections:[
      {id:'s5_1',title:{zh:'5.1 基金类型',en:'5.1 Fund Types'},diff:1,
       content:{
         zh:'<ul><li><b>共同基金 (Mutual Funds)</b>：<ul><li>开放式：按NAV每日交易，份额可变。</li><li>封闭式：份额固定，交易所交易，可溢价/折价。</li></ul></li><li><b>货币市场基金 (MMF)</b>：投资短期国债/商票，低风险，类现金。</li><li><b>私募/对冲基金</b>：面向合格投资者（净资产>$1M或收入>$200K），高门槛，高费用（2/20结构），策略灵活。</li></ul>',
         en:'<ul><li><b>Mutual Funds</b>:<ul><li>Open-end: Trade daily at NAV, variable shares.</li><li>Closed-end: Fixed shares, exchange-traded, may trade at premium/discount.</li></ul></li><li><b>Money Market Funds (MMF)</b>: Invest in short-term T-bills/commercial paper, low risk, cash-like.</li><li><b>Private/Hedge Funds</b>: For accredited investors (net worth >$1M or income >$200K), high minimums, high fees (2/20 structure), flexible strategies.</li></ul>'
       }},
      {id:'s5_2',title:{zh:'5.2 费用结构',en:'5.2 Fee Structure'},diff:2,
       content:{
         zh:'<ul><li><b>前端收费 (Class A)</b>：买入时付费。</li><li><b>后端收费 (Class B)</b>：卖出时付费，随持有时间递减。</li><li><b>管理费</b>：按AUM每年收取。</li><li><b>绩效费</b>：按利润收取（常见于对冲基金），通常为超过门槛利润的20%。</li></ul>',
         en:'<ul><li><b>Front-end Load (Class A)</b>: Paid when buying.</li><li><b>Back-end Load (Class B)</b>: Paid when selling, decreases with holding time.</li><li><b>Management Fee</b>: Charged annually based on AUM.</li><li><b>Performance Fee</b>: Charged on profits (common in hedge funds), typically 20% of gains above hurdle rate.</li></ul>'
       }}
    ]
  },

       content:{
         zh:'<h3>收益类型</h3><ul><li><b>价格回报 (Price Return)</b>：仅看指数水平变化，不含股息。</li><li><b>总回报 (Total Return)</b>：包含价格变化+股息再投资。</li></ul><h3>加权方法</h3><ul><li><b>价格加权 (DJIA)</b>：高价股影响大。</li><li><b>市值加权 (S&P500)</b>：大市值公司影响大。</li><li><b>等权重</b>：所有成分股影响相同。</li></ul>',
         en:'<h3>Return Types</h3><ul><li><b>Price Return</b>: Only index level changes, excludes dividends.</li><li><b>Total Return</b>: Includes price changes + reinvested dividends.</li></ul><h3>Weighting Methods</h3><ul><li><b>Price-weighted (DJIA)</b>: Higher-priced stocks have more impact.</li><li><b>Market-cap weighted (S&P 500)</b>: Larger companies have more impact.</li><li><b>Equal-weighted</b>: All stocks have equal impact.</li></ul>'
       }},

         en:'<ul><li><b>U.S.</b>: S&P 500 (large-cap, market-cap weighted), NASDAQ-100 (tech/growth), Russell 2000 (small-cap), DJIA (price-weighted, 30 stocks)</li><li><b>International</b>: MSCI EAFE (developed ex-US/Canada), MSCI Emerging Markets</li></ul>'

    sections:[
      {id:'s7_1',title:{zh:'7.1 财务报表基础',en:'7.1 Financial Statement Basics'},diff:1,
       content:{
         zh:'<p>财务报表是总结公司财务活动的正式记录。上市公司需向SEC提交季报(10-Q)和年报(10-K)。</p><ul><li><b>US GAAP</b>（FASB制定）：美国上市公司必须遵守，规则导向。</li><li><b>IFRS</b>（IASB制定）：140+国家使用，原则导向。</li></ul>',
         en:'<p>Financial statements are formal records summarizing company financial activities. Public companies must file quarterly (10-Q) and annual (10-K) reports with the SEC.</p><ul><li><b>US GAAP</b> (by FASB): Mandatory for US public companies, rules-based.</li><li><b>IFRS</b> (by IASB): Used in 140+ countries, principles-based.</li></ul>'
       }},
      {id:'s7_2',title:{zh:'7.2 三大报表',en:'7.2 Three Financial Statements'},diff:2,
       content:{
         zh:'<h3>损益表 (Income Statement)</h3><div class="formula">收入 - COGS = 毛利；毛利 - 运营费用 = 营业利润 (EBIT)；EBIT - 利息/税 = 净利润</div><h3>资产负债表 (Balance Sheet)</h3><div class="formula">资产 (Assets) = 负债 (Liabilities) + 股东权益 (Equity)</div><p>反映特定时点的财务状况。</p><h3>现金流量表 (Cash Flow Statement)</h3><ul><li><b>经营 (CFO)</b>：核心业务运营的现金</li><li><b>投资 (CFI)</b>：购买/出售资产的现金</li><li><b>融资 (CFF)</b>：发行股票/债务/分红的现金</li></ul>',
         en:'<h3>Income Statement</h3><div class="formula">Revenue - COGS = Gross Profit; Gross Profit - OpEx = Operating Income (EBIT); EBIT - Interest/Tax = Net Income</div><h3>Balance Sheet</h3><div class="formula">Assets = Liabilities + Shareholders\' Equity</div><p>Snapshot of financial position at a point in time.</p><h3>Cash Flow Statement</h3><ul><li><b>Operating (CFO)</b>: Cash from core business operations</li><li><b>Investing (CFI)</b>: Cash from buying/selling assets</li><li><b>Financing (CFF)</b>: Cash from issuing stock/debt/dividends</li></ul>'
       }},
      {id:'s7_3',title:{zh:'7.3 核心财务指标',en:'7.3 Key Financial Ratios'},diff:2,
       content:{
         zh:'<div class="formula">毛利率 = (收入 - COGS) / 收入</div><div class="formula">净利率 = 净利润 / 收入</div><div class="formula">ROE = 净利润 / 平均股东权益</div>',
         en:'<div class="formula">Gross Margin = (Revenue - COGS) / Revenue</div><div class="formula">Net Profit Margin = Net Income / Revenue</div><div class="formula">ROE = Net Income / Average Shareholders\' Equity</div>'
       }}
    ]

// ===== RENDER HELPERS =====
function t(obj) { return typeof obj === 'string' ? obj : (obj[currentLang] || obj.zh || ''); }
function diffStars(n) { return '<span class="diff">' + '\u2B50'.repeat(n) + '</span>'; }

function renderSidebar() {
  const nav = document.getElementById('sidebarNav');
  const isZh = currentLang === 'zh';
  let html = '<a class="' + (currentPage==='home'?'active':'') + '" onclick="goTo(\'home\')">\uD83C\uDFE0 ' + (isZh?'\u9996\u9875':'Home') + '</a>';
  chapters.forEach(function(ch, i) {
    html += '<a class="' + (currentPage===ch.id?'active':'') + '" onclick="goTo(\'' + ch.id + '\')">' + ch.icon + ' ' + t(ch.title) + '<span class="badge">' + ch.weight + '</span></a>';
  });
  html += '<a class="' + (currentPage==='quiz'?'active':'') + '" onclick="goTo(\'quiz\')">\uD83D\uDCDD ' + (isZh?'\u7EC3\u4E60\u9898\u5E93':'Quiz Bank') + '<span class="badge">74</span></a>';
  html += '<a class="' + (currentPage==='plan'?'active':'') + '" onclick="goTo(\'plan\')">\uD83D\uDCC5 ' + (isZh?'21\u5929\u5B66\u4E60\u8BA1\u5212':'21-Day Plan') + '</a>';
  html += '<a class="' + (currentPage==='checklist'?'active':'') + '" onclick="goTo(\'checklist\')">\u2705 ' + (isZh?'\u77E5\u8BC6\u6E05\u5355':'Knowledge Checklist') + '</a>';
  nav.innerHTML = html;
  document.getElementById('sidebarTitle').textContent = isZh ? '\u5165\u95E8\u8003\u8BD5\u5B66\u4E60\u6307\u5357' : 'Entry Exam Guide';
  var bp = document.getElementById('bookmarksPanel');
  var bs = document.getElementById('bookmarksSection');
  if (state.bookmarks.length > 0) {
    bs.style.display = 'block';
    bp.innerHTML = state.bookmarks.map(function(b) { return '<div class="bookmark-item" onclick="goTo(\'' + b.page + '\')">' + b.label + '<span onclick="event.stopPropagation();removeBookmark(\'' + b.page + '\')">\u2715</span></div>'; }).join('');
  } else { bs.style.display = 'none'; }
}

function goTo(page) {
  currentPage = page; localStorage.setItem('currentPage', page);
  renderSidebar(); renderMain();
  window.scrollTo(0, 0);
  if (window.innerWidth < 769) { document.getElementById('sidebar').classList.remove('open'); document.querySelector('.overlay').classList.remove('show'); }
}

function renderMain() {
  var m = document.getElementById('mainContent');
  if (currentPage === 'home') m.innerHTML = renderHome();
  else if (currentPage === 'quiz') m.innerHTML = renderQuizPage();
  else if (currentPage === 'plan') m.innerHTML = renderPlanPage();
  else if (currentPage === 'checklist') m.innerHTML = renderChecklistPage();
  else {
    var idx = chapters.findIndex(function(c) { return c.id === currentPage; });
    if (idx >= 0) m.innerHTML = renderChapter(idx);
  }
}

  html += '<div class="stat-grid">';

  html += '<div class="stat-box"><div class="num">' + totalQ + '/74</div><div class="label">' + (isZh?'\u5DF2\u505A\u9898\u6570':'Questions') + '</div><div class="progress-bar"><div class="fill" style="width:' + Math.round(totalQ/74*100) + '%"></div></div></div>';
  html += '<div class="stat-box"><div class="num">' + (totalQ?Math.round(correctQ/totalQ*100):0) + '%</div><div class="label">' + (isZh?'\u6B63\u786E\u7387':'Accuracy') + '</div></div>';
  html += '<div class="stat-box"><div class="num">' + checkDone + '</div><div class="label">' + (isZh?'\u5DF2\u638C\u63E1':'Checked') + '</div></div>';
  html += '</div></div>';
  html += '<div class="card"><h2>' + (isZh?'\uD83D\uDCDA \u7AE0\u8282\u5BFC\u822A':'\uD83D\uDCDA Chapters') + '</h2><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;">';
  chapters.forEach(function(ch, i) {
    var chQ = questions.filter(function(q){return q.ch===i;});
    var chDone = chQ.filter(function(q){return state.quizAnswers['q'+questions.indexOf(q)];}).length;
    html += '<div class="card" style="cursor:pointer;border-left:4px solid ' + chapterColors[i] + ';margin:0;padding:16px;" onclick="goTo(\'' + ch.id + '\')">';
    html += '<div style="font-size:24px;margin-bottom:4px;">' + ch.icon + '</div>';
    html += '<div style="font-weight:600;font-size:14px;">' + t(ch.title) + '</div>';
    html += '<div style="font-size:12px;color:var(--text-secondary);margin-top:4px;">' + ch.weight + ' | ' + ch.studyTime + '</div>';
    html += '<div class="progress-bar" style="margin-top:8px;"><div class="fill" style="width:' + (chQ.length?Math.round(chDone/chQ.length*100):0) + '%"></div></div>';
    html += '<div style="font-size:11px;color:var(--text-secondary);">' + chDone + '/' + chQ.length + ' ' + (isZh?'\u9898':'Q') + '</div></div>';
  });
  html += '</div></div>';
  return html;
}

function renderChapter(idx) {
  var ch = chapters[idx];
  var isZh = currentLang === 'zh';
  var chQ = questions.filter(function(q){return q.ch===idx;});
  var bk = state.bookmarks.find(function(b){return b.page===ch.id;});
  var html = '<div class="search-bar"><input type="text" placeholder="' + (isZh?'\u641C\u7D22...':'Search...') + '" oninput="doSearch(this.value)" id="searchInput"><div class="search-results" id="searchResults"></div></div>';
  html += '<div class="chapter-header" style="background:' + chapterColors[idx] + '">';
  html += '<span style="font-size:32px">' + ch.icon + '</span><div><h1>' + t(ch.title) + '</h1></div>';
  html += '<span class="weight">' + ch.weight + '</span><span class="time">' + ch.studyTime + '</span>';
  html += '<button class="bookmark-btn ' + (bk?'active':'') + '" onclick="toggleBookmark(\'' + ch.id + '\',\'' + t(ch.title).replace(/'/g,"\\'") + '\')" style="color:#fff">' + (bk?'\u2605':'\u2606') + '</button></div>';
  ch.sections.forEach(function(sec) {
    html += '<div class="card" id="' + sec.id + '"><div class="section-toggle" onclick="this.classList.toggle(\'open\');this.nextElementSibling.classList.toggle(\'show\')"><span class="arrow">\u25B6</span> ' + t(sec.title) + ' ' + diffStars(sec.diff) + '</div><div class="section-content">' + t(sec.content) + '</div></div>';
  });
  if (chQ.length > 0) {
    html += '<div class="card"><h2>\uD83D\uDCDD ' + (isZh?'\u7AE0\u8282\u7EC3\u4E60':'Practice') + ' (' + chQ.length + (isZh?' \u9898':' Q') + ')</h2>';
    chQ.forEach(function(q) { var gi = questions.indexOf(q); html += renderQuestion(q, gi, state.quizAnswers['q'+gi]); });
    html += '</div>';
  }
  return html;
}

function renderQuestion(q, idx, userAns) {
  var answered = userAns !== undefined;
  var html = '<div class="question-card"><h4>Q' + (idx+1) + '. ' + t(q.q) + '</h4>';
  q.opts.forEach(function(opt, oi) {
    var cls = 'option-btn';
    if (answered) { cls += ' disabled'; if (oi === q.ans) cls += ' correct'; else if (userAns && userAns.selected === oi) cls += ' wrong'; }
    html += '<button class="' + cls + '" onclick="answerQ(' + idx + ',' + oi + ')">' + String.fromCharCode(65+oi) + ') ' + t(opt) + '</button>';
  });
  html += '<div class="explanation ' + (answered?'show':'') + '">' + t(q.exp) + '</div></div>';
  return html;
}

function answerQ(idx, selected) {
  var q = questions[idx];
  var correct = selected === q.ans;
  var a = Object.assign({}, state.quizAnswers);
  a['q'+idx] = {selected:selected, correct:correct};
  save('quizAnswers', a);
  renderMain();
}

function renderQuizPage() {
  var isZh = currentLang === 'zh';
  var totalDone = Object.keys(state.quizAnswers).length;
  var totalCorrect = Object.values(state.quizAnswers).filter(function(a){return a.correct;}).length;
  var wrongCount = Object.values(state.quizAnswers).filter(function(a){return !a.correct;}).length;
  var html = '<div class="card"><h2>\uD83D\uDCDD ' + (isZh?'\u7EC3\u4E60\u9898\u5E93':'Quiz Bank') + '</h2>';
  html += '<div class="stat-grid"><div class="stat-box"><div class="num">' + totalDone + '/74</div><div class="label">' + (isZh?'\u5DF2\u5B8C\u6210':'Done') + '</div></div>';
  html += '<div class="stat-box"><div class="num">' + (totalDone?Math.round(totalCorrect/totalDone*100):0) + '%</div><div class="label">' + (isZh?'\u6B63\u786E\u7387':'Accuracy') + '</div></div>';
  html += '<div class="stat-box"><div class="num">' + wrongCount + '</div><div class="label">' + (isZh?'\u9519\u9898':'Wrong') + '</div></div></div>';
  html += '<div class="quiz-controls"><button onclick="resetQuiz()" class="btn btn-danger">' + (isZh?'\u91CD\u7F6E':'Reset All') + '</button></div></div>';
  html += '<div class="tabs" id="quizTabs"><div class="tab active" onclick="showQuizTab(-1)">' + (isZh?'\u5168\u90E8':'All') + ' (74)</div>';
  chapters.forEach(function(ch,i) { html += '<div class="tab" onclick="showQuizTab(' + i + ')">' + ch.icon + ' (' + questions.filter(function(q){return q.ch===i;}).length + ')</div>'; });
  html += '<div class="tab" onclick="showQuizTab(-2)" style="color:var(--danger);">' + (isZh?'\u9519\u9898':'Wrong') + '</div></div>';
  html += '<div id="quizContent">';
  questions.forEach(function(q, idx) {
    var ua = state.quizAnswers['q'+idx];
    var isWrong = ua && !ua.correct ? '1' : '0';
    html += '<div class="quiz-q" data-ch="' + q.ch + '" data-wrong="' + isWrong + '">' + renderQuestion(q, idx, ua) + '</div>';
  });
  html += '</div>';
  return html;
}

function showQuizTab(ch) {
  document.querySelectorAll('#quizTabs .tab').forEach(function(t,i) { t.classList.toggle('active', ch===-1?i===0 : ch===-2?i===chapters.length+1 : i===ch+1); });
  document.querySelectorAll('.quiz-q').forEach(function(el) {
    if (ch === -1) el.style.display = '';
    else if (ch === -2) el.style.display = el.dataset.wrong==='1' ? '' : 'none';
    else el.style.display = el.dataset.ch == ch ? '' : 'none';
  });
}

function resetQuiz() {
  if (confirm(currentLang==='zh'?'\u786E\u5B9A\u91CD\u7F6E\u6240\u6709\u7EC3\u4E60\u8BB0\u5F55\uFF1F':'Reset all quiz answers?')) {
    save('quizAnswers', {}); renderMain();
  }
}

// ===== SEARCH =====
function doSearch(query) {
  var res = document.getElementById('searchResults');
  if (!query || query.length < 2) { res.classList.remove('show'); return; }
  var q = query.toLowerCase();
  var results = [];
  chapters.forEach(function(ch, ci) {
    ch.sections.forEach(function(sec) {
      var content = t(sec.content).replace(/<[^>]+>/g, '');
      var title = t(sec.title);
      if (content.toLowerCase().indexOf(q) >= 0 || title.toLowerCase().indexOf(q) >= 0) {
        var idx = content.toLowerCase().indexOf(q);
        var snippet = idx >= 0 ? '...' + content.slice(Math.max(0,idx-30), idx+50) + '...' : title;
        results.push({page: ch.id, label: t(ch.title) + ' > ' + title, snippet: snippet});
      }
    });
  });
  if (results.length > 0) {
    res.innerHTML = results.slice(0, 8).map(function(r) { return '<div class="search-result-item" onclick="goTo(\'' + r.page + '\')"><div style="font-weight:600;font-size:12px;">' + r.label + '</div><div>' + r.snippet + '</div></div>'; }).join('');
    res.classList.add('show');
  } else {
    res.innerHTML = '<div class="search-result-item">' + (currentLang==='zh'?'\u672A\u627E\u5230':'No results') + '</div>';
    res.classList.add('show');
  }
}

// ===== BOOKMARKS =====
function toggleBookmark(page, label) {
  var bks = state.bookmarks.slice();
  var idx = bks.findIndex(function(b){return b.page===page;});
  if (idx >= 0) bks.splice(idx, 1);
  else bks.push({page:page, label:label});
  save('bookmarks', bks); renderSidebar(); renderMain();
}
function removeBookmark(page) {
  save('bookmarks', state.bookmarks.filter(function(b){return b.page!==page;}));
  renderSidebar();
}

// ===== TOGGLES =====
function toggleDark() {
  isDark = !isDark; localStorage.setItem('dark', isDark);
  document.body.classList.toggle('dark', isDark);
  document.getElementById('darkBtn').textContent = isDark ? '\u2600\uFE0F' : '\uD83C\uDF19';
}
function toggleLang() {
  currentLang = currentLang === 'zh' ? 'en' : 'zh';
  localStorage.setItem('lang', currentLang);
  document.getElementById('langBtn').textContent = currentLang === 'zh' ? 'EN' : '\u4E2D';
  document.getElementById('langBtn').classList.toggle('active-toggle', currentLang === 'en');
  renderSidebar(); renderMain();
}
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.querySelector('.overlay').classList.toggle('show');
}

// ===== INIT =====
if (isDark) { document.body.classList.add('dark'); document.getElementById('darkBtn').textContent = '\u2600\uFE0F'; }
if (currentLang === 'en') { document.getElementById('langBtn').textContent = '\u4E2D'; document.getElementById('langBtn').classList.add('active-toggle'); }
renderSidebar(); renderMain();
document.addEventListener('click', function(e) { if (!e.target.closest('.search-bar')) { var r = document.getElementById('searchResults'); if (r) r.classList.remove('show'); }});
