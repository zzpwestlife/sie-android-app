syntax = "proto3";

option java_package = "com.sie.core.datastore";
option java_multiple_files = true;

enum DarkThemeConfig {
    DARK_THEME_CONFIG_FOLLOW_SYSTEM = 0;
    DARK_THEME_CONFIG_LIGHT = 1;
    DARK_THEME_CONFIG_DARK = 2;
}

message UserPreferences {
    DarkThemeConfig dark_theme_config = 1;
    bool use_dynamic_color = 2;
    // Add font size later if needed, or now if explicitly asked. 
    // Plan says "Theme (Dark/Light) and Font Size".
    // Let's add font size.
    int32 font_size_scale = 3; // 0 = default/medium, -1 = small, 1 = large? Or explicit enum?
    string language = 4; // "zh" or "en"
}
